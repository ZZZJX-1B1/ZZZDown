name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: intel
          - runner: macos-14
            arch: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: chmod +x scripts/build_macos.sh && scripts/build_macos.sh
      - run: mv dist/ZZZDown-macOS.dmg dist/ZZZDown-macOS-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ZZZDown-macOS-${{ matrix.arch }}
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: choco install innosetup --no-progress -y
      - shell: powershell
        run: scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ZZZDown-Windows
          path: dist/ZZZDown-Windows-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: artifacts, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
