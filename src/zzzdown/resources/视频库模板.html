<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__PAGE_TITLE__ · 本地视频库</title>
<style>
:root{color-scheme:light;--pink:#fb7299;--pink-dark:#d94d79;--ink:#18191c;--muted:#6d757a;--line:#e3e5e7;--bg:#f6f7f8;--panel:#fff;--blue:#1677ff;--danger:#c9365d}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}
header{position:sticky;top:0;z-index:10;padding:20px max(24px,calc((100vw - 1500px)/2));border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(14px)}
.headline{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.headline h1{margin:0 0 5px;font-size:26px}.summary{color:var(--muted);font-size:13px}
.toolbar{display:grid;grid-template-columns:minmax(260px,1fr) auto auto auto auto;gap:10px;margin-top:15px}.search,.sort-select{padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}.search{width:100%}.sort-select{cursor:pointer}.search:focus,.sort-select:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(251,114,153,.14)}
.button,.chip,.icon-button{appearance:none;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);cursor:pointer}.button{padding:9px 12px;white-space:nowrap}.button:hover,.chip:hover,.icon-button:hover{border-color:#aeb3b7}.button.primary{border-color:var(--pink);color:#fff;background:var(--pink)}.button.danger{border-color:#efb0c2;color:var(--danger);background:#fff5f8}.button:disabled{opacity:.5;cursor:wait}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:10px}.filter-label{margin-right:2px;color:var(--muted);font-size:12px}.chip{padding:6px 10px;border-radius:999px;font-size:12px}.chip.active{border-color:var(--pink);color:var(--pink-dark);background:#fff2f6}.channels .chip{min-width:96px;border-radius:9px;font-weight:600}
.task-filter-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:8px}.task-filter-row .filters.collapsed{max-height:31px;overflow:hidden}.task-filter-toggle{margin-top:10px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);cursor:pointer;font-size:12px;white-space:nowrap}.task-filter-toggle:hover{border-color:#aeb3b7;color:var(--ink)}
.bulk-bar{display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 11px;border:1px solid #f0b4c6;border-radius:11px;background:#fff5f8}.bulk-bar[hidden]{display:none}.bulk-count{margin-right:auto;font-weight:650;color:#a52d52}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;max-width:1500px;margin:0 auto;padding:20px 24px}.sidebar{position:sticky;top:188px;align-self:start;max-height:calc(100vh - 210px);overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.035)}
.sidebar-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96)}.sidebar-head h2{margin:0;font-size:16px}.folder-tree{padding:8px}.folder-row{display:flex;align-items:center;gap:4px;min-height:38px;padding:3px 5px 3px calc(7px + var(--depth,0)*16px);border-radius:8px}.folder-row:hover{background:#f6f7f8}.folder-row.active{color:var(--pink-dark);background:#fff0f4}.folder-main{display:flex;min-width:0;flex:1;align-items:center;gap:7px;padding:5px 2px;border:0;background:transparent;color:inherit;cursor:pointer;text-align:left}.folder-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.folder-count{margin-left:auto;color:var(--muted);font-size:11px}.folder-actions{display:none;gap:2px}.folder-row:hover .folder-actions{display:flex}.icon-button{width:25px;height:25px;padding:0;border-color:transparent;color:var(--muted);font-size:12px}.folder-empty{padding:16px;color:var(--muted);font-size:12px;text-align:center}
.library-main{min-width:0}.notice{margin:0 0 16px;padding:12px 14px;border:1px solid #f0d695;border-radius:10px;color:#72551b;background:#fff9e9;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.04)}.card.selected{border-color:var(--pink);box-shadow:0 0 0 2px rgba(251,114,153,.14)}.card.duplicate{border-color:#f4b5c9}.select-wrap{position:absolute;z-index:3;top:9px;left:9px;display:grid;width:28px;height:28px;place-items:center;border-radius:8px;background:rgba(255,255,255,.94);box-shadow:0 2px 10px rgba(0,0,0,.18)}.card-select{width:17px;height:17px;accent-color:var(--pink);cursor:pointer}
.cover{position:relative;display:block;overflow:hidden;aspect-ratio:16/9;background:#e7e9eb}.cover img{width:100%;height:100%;object-fit:cover;transition:transform .2s}.cover:hover img{transform:scale(1.03)}.placeholder{display:grid;width:100%;height:100%;place-items:center;color:var(--muted)}.duration{position:absolute;right:8px;bottom:8px;padding:3px 7px;border-radius:5px;color:#fff;background:rgba(0,0,0,.68);font-size:12px}.body{padding:12px 13px 13px}.badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}.badge{padding:3px 6px;border-radius:6px;color:#526069;background:#f0f2f3;font-size:10px}.badge.site{color:#0d6670;background:#e9f7f8}.badge.folder{color:#795a16;background:#fff6dd}.badge.duplicate{color:#b42e59;background:#fff0f4}.task{margin-bottom:4px;overflow:hidden;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}.title{display:-webkit-box;min-height:42px;overflow:hidden;color:var(--ink);text-decoration:none;font-weight:650;line-height:1.4;-webkit-line-clamp:2;-webkit-box-orient:vertical}.title:hover{color:var(--pink)}.meta{display:flex;justify-content:space-between;gap:7px;margin-top:9px;color:var(--muted);font-size:11px}.original{color:var(--muted);text-decoration:none}.card-actions{display:flex;gap:5px;margin-top:10px}.card-action{flex:1;padding:6px 5px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#526069;cursor:pointer;font-size:11px}.card-action:hover{background:#f5f6f7}.card-action.delete{border-color:#f0b4c6;color:var(--danger);background:#fff7f9}.empty{padding:80px 20px;text-align:center;color:var(--muted)}
dialog{padding:0;border:1px solid var(--line);border-radius:16px;background:var(--bg);box-shadow:0 24px 80px rgba(0,0,0,.24)}dialog::backdrop{background:rgba(20,25,28,.42);backdrop-filter:blur(3px)}.dialog-card{width:min(520px,calc(100vw - 32px))}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);background:#fff}.dialog-head h2{margin:0;font-size:19px}.dialog-body{display:grid;gap:14px;padding:18px}.field{display:grid;gap:6px}.field label{color:var(--muted);font-size:12px}.field input,.field select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 18px}.recycle-dialog{width:min(980px,calc(100vw - 32px));max-height:82vh}.trash-list{display:grid;gap:10px;padding:16px}.trash-item{display:grid;grid-template-columns:140px 1fr auto;gap:13px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:11px;background:#fff}.trash-thumb{width:140px;aspect-ratio:16/9;object-fit:cover;border-radius:7px;background:#e7e9eb}.trash-title{margin-bottom:4px;font-weight:650}.trash-meta{color:var(--muted);font-size:11px;line-height:1.6}.trash-empty{padding:55px 20px;text-align:center;color:var(--muted)}
.readonly .sidebar,.readonly .manage-only{display:none!important}.readonly .shell{grid-template-columns:1fr}
@media(max-width:850px){header{padding:16px}.toolbar{grid-template-columns:1fr 1fr}.shell{grid-template-columns:1fr;padding:14px}.sidebar{position:relative;top:auto;max-height:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.folder-actions{display:flex}}
@media(max-width:540px){.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.bulk-bar{flex-wrap:wrap}.trash-item{grid-template-columns:90px 1fr}.trash-thumb{width:90px}.trash-item .button{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <div class="headline"><div><h1>__PAGE_TITLE__ · 本地视频库</h1><div class="summary"><span id="count"></span> 个视频 · 索引更新于 __GENERATED_AT__</div></div></div>
  <div class="toolbar"><input id="search" class="search" type="search" placeholder="搜索标题、创作者、任务或 BV/AV 号…"><select id="sortOrder" class="sort-select" aria-label="视频排序"><option value="published">发布时间排序</option><option value="downloadTask">下载任务顺序</option></select><button id="duplicates" class="button" type="button">只看重复项</button><button id="cleanAll" class="button danger manage-only" type="button">清理重复项</button><button id="recycleBin" class="button manage-only" type="button">回收站</button></div>
  <div id="siteFilters" class="filters channels"></div><div id="typeFilters" class="filters"></div><div class="task-filter-row"><div id="taskFilters" class="filters"></div><button id="taskFilterToggle" class="task-filter-toggle" type="button">展开全部</button></div><div id="downloadDateFilters" class="filters"></div>
  <div id="bulkBar" class="bulk-bar manage-only" hidden><span id="bulkCount" class="bulk-count"></span><button id="selectShown" class="button" type="button">全选当前结果</button><button id="bulkClassify" class="button" type="button">移动到文件夹</button><button id="bulkTrash" class="button danger" type="button">删除所选</button><button id="clearSelection" class="button" type="button">取消选择</button></div>
</header>
<div class="shell">
  <aside class="sidebar manage-only"><div class="sidebar-head"><h2>自定义文件夹</h2><button id="newRootFolder" class="button primary" type="button">＋ 新建</button></div><div id="folderTree" class="folder-tree"></div></aside>
  <main class="library-main"><div id="managementNotice" class="notice" hidden>管理功能需要通过“打开全局视频库.command”启动。</div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>没有找到匹配的视频</div></main>
</div>

<dialog id="folderDialog" class="dialog-card"><form id="folderForm"><div class="dialog-head"><h2 id="folderDialogTitle">新建文件夹</h2><button class="icon-button" type="button" data-close="folderDialog">×</button></div><div class="dialog-body"><div id="folderNameField" class="field"><label for="folderName">文件夹名称</label><input id="folderName" maxlength="80" autocomplete="off"></div><div id="folderParentField" class="field"><label for="folderParent">上级文件夹</label><select id="folderParent"></select></div></div><div class="dialog-foot"><button class="button" type="button" data-close="folderDialog">取消</button><button class="button primary" type="submit">保存</button></div></form></dialog>
<dialog id="classifyDialog" class="dialog-card"><form id="classifyForm"><div class="dialog-head"><h2>移动到自定义文件夹</h2><button class="icon-button" type="button" data-close="classifyDialog">×</button></div><div class="dialog-body"><div id="classifySummary" class="summary"></div><div class="field"><label for="classifyTarget">目标文件夹</label><select id="classifyTarget"></select></div></div><div class="dialog-foot"><button class="button" type="button" data-close="classifyDialog">取消</button><button class="button primary" type="submit">移动</button></div></form></dialog>
<dialog id="recycleDialog" class="recycle-dialog"><div class="dialog-head"><div><h2>视频库回收站</h2><div id="trashSummary" class="summary"></div></div><div><button id="restoreAll" class="button" type="button">全部还原</button> <button id="emptyTrash" class="button danger" type="button">清空回收站</button> <button class="button" type="button" data-close="recycleDialog">关闭</button></div></div><div id="trashList" class="trash-list"></div></dialog>

<script>
let items=__ITEMS_JSON__;
const managementToken=__TOKEN_JSON__;
const apiBase=location.protocol==='http:'?'':'http://127.0.0.1:8765';
const grid=document.getElementById('grid'),empty=document.getElementById('empty'),count=document.getElementById('count');
const state={site:'全部渠道',taskType:'全部类型',task:'全部任务',downloadDate:'全部日期',sortOrder:'published',taskFiltersCollapsed:true,duplicates:false,query:'',folder:'all'};
let libraryState={version:1,folders:[],assignments:{}},trashItems=[],shownItems=[],folderDialogMode='create',editingFolderId=null,classifyPaths=[];
const selected=new Set();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatBytes=n=>n>1073741824?`${(n/1073741824).toFixed(1)} GB`:`${Math.max(1,n/1048576).toFixed(0)} MB`;
async function apiRequest(path,options={}){const headers={'X-Video-Library-Token':managementToken,...(options.headers||{})};const response=await fetch(`${apiBase}${path}`,{...options,headers});const payload=await response.json();if(!response.ok)throw new Error(payload.error||'视频库操作失败');return payload}
const post=(path,payload)=>apiRequest(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
function folderMap(){return new Map(libraryState.folders.map(folder=>[folder.id,folder]))}
function folderPath(id){const map=folderMap(),parts=[],seen=new Set();let current=id;while(current&&map.has(current)&&!seen.has(current)){seen.add(current);parts.unshift(map.get(current).name);current=map.get(current).parentId}return parts.join(' / ')}
function folderDescendants(id){const found=new Set([id]);let changed=true;while(changed){changed=false;for(const folder of libraryState.folders){if(folder.parentId&&found.has(folder.parentId)&&!found.has(folder.id)){found.add(folder.id);changed=true}}}return found}
function matchesFolder(item){const assigned=libraryState.assignments[item.videoPath];if(state.folder==='all')return true;if(state.folder==='unassigned')return !assigned;return folderDescendants(state.folder).has(assigned)}
function matchingTasks(){const values=[...new Set(items.filter(x=>(state.site==='全部渠道'||x.site===state.site)&&(state.taskType==='全部类型'||x.taskType===state.taskType)).map(x=>x.task))];if(state.task!=='全部任务'&&values.includes(state.task))return[state.task,...values.filter(value=>value!==state.task)];return values}
function makeFilters(id,label,values,key,allLabel){const target=document.getElementById(id);target.innerHTML=`<span class="filter-label">${label}</span>`+[allLabel,...values].map(value=>`<button type="button" class="chip ${state[key]===value?'active':''}" data-filter="${key}" data-value="${esc(value)}">${esc(value)}${value===allLabel?'':` · ${items.filter(x=>x[key]===value).length}`}</button>`).join('')}
function updateTaskFilterCollapse(){const target=document.getElementById('taskFilters'),button=document.getElementById('taskFilterToggle');target.classList.remove('collapsed');button.hidden=false;const first=target.querySelector('.chip'),needsCollapse=first&&[...target.querySelectorAll('.chip')].some(chip=>chip.offsetTop>first.offsetTop+2);button.hidden=!needsCollapse;if(needsCollapse&&state.taskFiltersCollapsed)target.classList.add('collapsed');button.textContent=state.taskFiltersCollapsed?'展开全部':'收起'}
const dayStart=value=>{const date=new Date(value);return new Date(date.getFullYear(),date.getMonth(),date.getDate()).getTime()};
function downloadAge(item){const timestamp=Number(item.downloadTimestamp);if(!Number.isFinite(timestamp))return null;return Math.max(0,Math.floor((dayStart(Date.now())-dayStart(timestamp))/86400000))}
function downloadDateGroup(item){const age=downloadAge(item);if(age===null)return'';if(age<=6)return item.downloadDate||'';if(age<=14)return'第 8–15 天';if(age<=29)return'第 16–30 天';return'更早'}
function matchesDownloadDate(item){return state.downloadDate==='全部日期'||downloadDateGroup(item)===state.downloadDate}
function renderDownloadDateFilters(){const recent=[...new Set(items.filter(item=>{const age=downloadAge(item);return age!==null&&age<=6}).map(item=>item.downloadDate).filter(Boolean))].sort().reverse();const ranges=['第 8–15 天','第 16–30 天','更早'].filter(value=>items.some(item=>downloadDateGroup(item)===value));const values=[...recent,...ranges];if(state.downloadDate!=='全部日期'&&!values.includes(state.downloadDate))state.downloadDate='全部日期';document.getElementById('downloadDateFilters').innerHTML='<span class="filter-label">下载日期</span>'+['全部日期',...values].map(value=>`<button type="button" class="chip ${state.downloadDate===value?'active':''}" data-filter="downloadDate" data-value="${esc(value)}">${esc(value)}${value==='全部日期'?'':` · ${items.filter(item=>downloadDateGroup(item)===value).length}`}</button>`).join('')}
function refreshFilters(){makeFilters('siteFilters','渠道',[...new Set(items.map(x=>x.site))],'site','全部渠道');makeFilters('typeFilters','任务类型',['创作者主页','合集/播放列表','单个视频'].filter(v=>items.some(x=>x.taskType===v)),'taskType','全部类型');makeFilters('taskFilters','下载任务',matchingTasks(),'task','全部任务');renderDownloadDateFilters();requestAnimationFrame(updateTaskFilterCollapse);document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{const key=button.dataset.filter;state[key]=button.dataset.value;if(key==='site'||key==='taskType')state.task='全部任务';refreshFilters();render()})}
function folderCount(id){const ids=folderDescendants(id);return items.filter(item=>ids.has(libraryState.assignments[item.videoPath])).length}
function folderRows(parentId=null,depth=0,visited=new Set()){return libraryState.folders.filter(folder=>(folder.parentId||null)===parentId&&!visited.has(folder.id)).map(folder=>{const next=new Set(visited);next.add(folder.id);return`<div class="folder-row ${state.folder===folder.id?'active':''}" style="--depth:${depth}"><button class="folder-main" type="button" data-folder-select="${folder.id}" title="${esc(folderPath(folder.id))}"><span>📁</span><span class="folder-name">${esc(folder.name)}</span><span class="folder-count">${folderCount(folder.id)}</span></button><span class="folder-actions"><button class="icon-button" type="button" data-folder-add="${folder.id}" title="新建子文件夹">＋</button><button class="icon-button" type="button" data-folder-rename="${folder.id}" title="重命名">✎</button><button class="icon-button" type="button" data-folder-move="${folder.id}" title="移动文件夹">⇄</button><button class="icon-button" type="button" data-folder-delete="${folder.id}" title="删除文件夹">×</button></span></div>${folderRows(folder.id,depth+1,next)}`}).join('')}
function renderFolders(){const tree=document.getElementById('folderTree');const unassigned=items.filter(item=>!libraryState.assignments[item.videoPath]).length;tree.innerHTML=`<div class="folder-row ${state.folder==='all'?'active':''}" style="--depth:0"><button class="folder-main" data-folder-select="all"><span>▦</span><span class="folder-name">全部视频</span><span class="folder-count">${items.length}</span></button></div><div class="folder-row ${state.folder==='unassigned'?'active':''}" style="--depth:0"><button class="folder-main" data-folder-select="unassigned"><span>◇</span><span class="folder-name">未分类</span><span class="folder-count">${unassigned}</span></button></div>${folderRows()||'<div class="folder-empty">点击“新建”创建第一个虚拟文件夹</div>'}`}
function renderBulk(){const bar=document.getElementById('bulkBar');bar.hidden=selected.size===0;document.getElementById('bulkCount').textContent=`已选择 ${selected.size} 个视频`}
function comparePublished(a,b){return String(b.sortDate||'').localeCompare(String(a.sortDate||''))||String(b.title||'').localeCompare(String(a.title||''))}
function compareDownloadTask(a,b){return(Number(b.downloadTaskStartedTimestamp)||0)-(Number(a.downloadTaskStartedTimestamp)||0)||String(a.downloadTaskId||'').localeCompare(String(b.downloadTaskId||''))||(Number(a.downloadBatchIndex)||0)-(Number(b.downloadBatchIndex)||0)||(Number(a.downloadItemIndex)||0)-(Number(b.downloadItemIndex)||0)||(Number(a.downloadTimestamp)||0)-(Number(b.downloadTimestamp)||0)||String(a.title||'').localeCompare(String(b.title||''))}
function render(){const q=state.query.trim().toLocaleLowerCase();shownItems=items.filter(x=>(state.site==='全部渠道'||x.site===state.site)&&(state.taskType==='全部类型'||x.taskType===state.taskType)&&(state.task==='全部任务'||x.task===state.task)&&matchesDownloadDate(x)&&(!state.duplicates||x.duplicateCount>1)&&matchesFolder(x)&&(!q||`${x.title} ${x.date} ${x.downloadDate} ${x.id} ${x.description} ${x.task} ${x.site} ${x.taskType}`.toLocaleLowerCase().includes(q))).sort(state.sortOrder==='downloadTask'?compareDownloadTask:comparePublished);count.textContent=shownItems.length===items.length?items.length:`${shownItems.length} / ${items.length}`;grid.innerHTML=shownItems.map(x=>{const folderId=libraryState.assignments[x.videoPath],folderLabel=folderId?folderPath(folderId):'';return`<article class="card ${selected.has(x.videoPath)?'selected':''} ${x.duplicateCount>1?'duplicate':''}" data-path="${esc(x.videoPath)}"><label class="select-wrap manage-only" title="选择视频"><input class="card-select" type="checkbox" data-select="${esc(x.videoPath)}" ${selected.has(x.videoPath)?'checked':''}></label><a class="cover" href="${x.video}" target="_blank">${x.thumbnail?`<img src="${x.thumbnail}" loading="lazy" alt="">`:'<span class="placeholder">暂无封面</span>'}${x.duration?`<span class="duration">${esc(x.duration)}</span>`:''}</a><div class="body"><div class="badges"><span class="badge site">${esc(x.site)}</span><span class="badge">${esc(x.taskType)}</span>${folderLabel?`<span class="badge folder">${esc(folderLabel)}</span>`:''}${x.duplicateCount>1?`<span class="badge duplicate">重复 ${x.duplicateCount} 份</span>`:''}</div><div class="task" title="${esc(x.task)}">任务：${esc(x.task)}</div><a class="title" href="${x.video}" target="_blank">${esc(x.title)}</a><div class="meta"><span>${esc(x.date||'日期未知')}${x.height?` · ${x.height}P`:''}</span><span>${formatBytes(x.fileSize)}</span>${x.original?`<a class="original" href="${x.original}" target="_blank">原网页 ↗</a>`:`<span>${esc(x.id)}</span>`}</div><div class="card-actions manage-only"><button class="card-action" type="button" data-classify="${esc(x.videoPath)}">分类</button><button class="card-action" type="button" data-reveal="${esc(x.videoPath)}">Finder</button><button class="card-action delete" type="button" data-trash="${esc(x.videoPath)}">删除</button></div></div></article>`}).join('');empty.hidden=shownItems.length!==0;renderFolders();renderBulk();updateCleanButton()}
function updateDuplicateCounts(){const counts={};items.forEach(x=>counts[x.duplicateKey]=(counts[x.duplicateKey]||0)+1);items.forEach(x=>x.duplicateCount=counts[x.duplicateKey])}
function cleanupCandidates(){const groups=new Map();for(const item of items){if(!groups.has(item.duplicateKey))groups.set(item.duplicateKey,[]);groups.get(item.duplicateKey).push(item)}const remove=[];for(const group of groups.values()){if(group.length<2)continue;group.sort((a,b)=>(b.height-a.height)||(b.fileSize-a.fileSize)||String(b.sortDate).localeCompare(String(a.sortDate)));remove.push(...group.slice(1))}return remove}
function updateCleanButton(){const candidates=cleanupCandidates(),button=document.getElementById('cleanAll');button.hidden=!candidates.length;button.textContent=candidates.length?`清理 ${candidates.length} 个重复项`:'没有重复项'}
function flatFolders(parentId=null,depth=0,seen=new Set()){const result=[];for(const folder of libraryState.folders.filter(item=>(item.parentId||null)===parentId)){if(seen.has(folder.id))continue;const next=new Set(seen);next.add(folder.id);result.push({id:folder.id,label:`${'　'.repeat(depth)}${folder.name}`});result.push(...flatFolders(folder.id,depth+1,next))}return result}
function parentOptions(excludedId=null){const excluded=excludedId?folderDescendants(excludedId):new Set();return`<option value="">顶层</option>`+flatFolders().filter(folder=>!excluded.has(folder.id)).map(folder=>`<option value="${folder.id}">${esc(folder.label)}</option>`).join('')}
function openFolderDialog(mode,folderId=null,parentId=null){folderDialogMode=mode;editingFolderId=folderId;const dialog=document.getElementById('folderDialog'),nameField=document.getElementById('folderNameField'),parentField=document.getElementById('folderParentField'),name=document.getElementById('folderName'),parent=document.getElementById('folderParent'),folder=folderMap().get(folderId);nameField.hidden=mode==='move';parentField.hidden=mode==='rename';document.getElementById('folderDialogTitle').textContent=mode==='create'?'新建文件夹':mode==='rename'?'重命名文件夹':'移动文件夹';name.value=folder?.name||'';parent.innerHTML=parentOptions(mode==='move'?folderId:null);parent.value=parentId??folder?.parentId??'';dialog.showModal();if(!nameField.hidden)setTimeout(()=>name.focus(),0)}
document.getElementById('folderForm').addEventListener('submit',async event=>{event.preventDefault();const payload={action:folderDialogMode};if(folderDialogMode==='create'){payload.name=document.getElementById('folderName').value;payload.parentId=document.getElementById('folderParent').value||null}else{payload.folderId=editingFolderId;if(folderDialogMode==='rename')payload.name=document.getElementById('folderName').value;else payload.parentId=document.getElementById('folderParent').value||null}try{const result=await post('/api/folders',payload);libraryState=result.state;document.getElementById('folderDialog').close();render()}catch(error){alert(error.message)}});
document.getElementById('folderTree').addEventListener('click',async event=>{const target=event.target.closest('button');if(!target)return;if(target.dataset.folderSelect){state.folder=target.dataset.folderSelect;render();return}if(target.dataset.folderAdd)openFolderDialog('create',null,target.dataset.folderAdd);if(target.dataset.folderRename)openFolderDialog('rename',target.dataset.folderRename);if(target.dataset.folderMove)openFolderDialog('move',target.dataset.folderMove);if(target.dataset.folderDelete){const id=target.dataset.folderDelete,folder=folderMap().get(id);if(!confirm(`删除虚拟文件夹“${folder?.name}”吗？\n\n其中的视频不会从磁盘删除；子文件夹会提升一级。`))return;try{const result=await post('/api/folders',{action:'delete',folderId:id});libraryState=result.state;if(state.folder===id)state.folder='all';render()}catch(error){alert(error.message)}}});
document.getElementById('newRootFolder').onclick=()=>openFolderDialog('create');
function openClassify(paths){classifyPaths=[...new Set(paths)];document.getElementById('classifySummary').textContent=`将 ${classifyPaths.length} 个视频移动到：`;document.getElementById('classifyTarget').innerHTML='<option value="">未分类</option>'+flatFolders().map(folder=>`<option value="${folder.id}">${esc(folder.label)}</option>`).join('');document.getElementById('classifyDialog').showModal()}
document.getElementById('classifyForm').addEventListener('submit',async event=>{event.preventDefault();try{const result=await post('/api/classify',{videoPaths:classifyPaths,folderId:document.getElementById('classifyTarget').value||null});libraryState=result.state;classifyPaths.forEach(path=>selected.delete(path));document.getElementById('classifyDialog').close();render()}catch(error){alert(error.message)}});
async function trashPaths(paths){paths=[...new Set(paths)].filter(path=>items.some(item=>item.videoPath===path));if(!paths.length)return;if(!confirm(`将 ${paths.length} 个视频及其封面、字幕和元数据移到视频库回收站吗？\n\n可以稍后从回收站还原。`))return;try{await post('/api/trash',{videoPaths:paths});const removed=new Set(paths);items=items.filter(item=>!removed.has(item.videoPath));paths.forEach(path=>selected.delete(path));updateDuplicateCounts();refreshFilters();render()}catch(error){document.getElementById('managementNotice').hidden=false;alert(error.message)}}
grid.addEventListener('change',event=>{const checkbox=event.target.closest('[data-select]');if(!checkbox)return;checkbox.checked?selected.add(checkbox.dataset.select):selected.delete(checkbox.dataset.select);render()});
grid.addEventListener('click',async event=>{const classify=event.target.closest('[data-classify]'),reveal=event.target.closest('[data-reveal]'),trash=event.target.closest('[data-trash]');if(classify)openClassify([classify.dataset.classify]);if(reveal){reveal.disabled=true;try{await post('/api/reveal',{videoPath:reveal.dataset.reveal})}catch(error){alert(error.message)}finally{reveal.disabled=false}}if(trash)trashPaths([trash.dataset.trash])});
document.getElementById('selectShown').onclick=()=>{shownItems.forEach(item=>selected.add(item.videoPath));render()};document.getElementById('clearSelection').onclick=()=>{selected.clear();render()};document.getElementById('bulkClassify').onclick=()=>openClassify([...selected]);document.getElementById('bulkTrash').onclick=()=>trashPaths([...selected]);
function renderTrash(){document.getElementById('trashSummary').textContent=`${trashItems.length} 个可还原视频`;document.getElementById('recycleBin').textContent=`回收站${trashItems.length?` · ${trashItems.length}`:''}`;document.getElementById('restoreAll').hidden=!trashItems.length;document.getElementById('emptyTrash').hidden=!trashItems.length;document.getElementById('trashList').innerHTML=trashItems.length?trashItems.map(x=>`<article class="trash-item"><div>${x.thumbnail?`<img class="trash-thumb" src="${x.thumbnail}" alt="">`:'<div class="trash-thumb placeholder">暂无封面</div>'}</div><div><div class="trash-title">${esc(x.title)}</div><div class="trash-meta">原任务：${esc(x.task)}<br>删除时间：${esc(x.deletedAt)} · ${formatBytes(x.fileSize)}</div></div><button class="button" type="button" data-restore="${esc(x.trashVideoPath)}">还原</button></article>`).join(''):'<div class="trash-empty">回收站是空的</div>'}
async function loadTrash(showErrors=false){try{const payload=await apiRequest('/api/trash-items');trashItems=payload.items||[];renderTrash()}catch(error){if(showErrors)alert(`${error.message}\n\n请重新双击“打开全局视频库.command”。`)}}
document.getElementById('recycleBin').onclick=async()=>{await loadTrash(true);document.getElementById('recycleDialog').showModal()};document.getElementById('trashList').onclick=async event=>{const button=event.target.closest('[data-restore]');if(!button)return;const item=trashItems.find(x=>x.trashVideoPath===button.dataset.restore);if(!item||!confirm(`将“${item.title}”还原到原任务目录吗？`))return;button.disabled=true;try{await post('/api/restore',{trashVideoPath:item.trashVideoPath});location.assign(`http://127.0.0.1:8765/?restored=${Date.now()}`)}catch(error){alert(error.message);button.disabled=false}};
document.getElementById('restoreAll').onclick=async event=>{if(!trashItems.length||!confirm(`确定还原回收站中的 ${trashItems.length} 个视频吗？`))return;event.currentTarget.disabled=true;try{await post('/api/restore',{trashVideoPaths:trashItems.map(x=>x.trashVideoPath)});location.assign(`http://127.0.0.1:8765/?restored=${Date.now()}`)}catch(error){alert(error.message);event.currentTarget.disabled=false}};
document.getElementById('emptyTrash').onclick=async event=>{if(!trashItems.length)return;const total=trashItems.reduce((sum,x)=>sum+x.fileSize,0),confirmation=prompt(`永久删除回收站中的 ${trashItems.length} 个视频（约 ${formatBytes(total)}），无法恢复。\n\n请输入“清空”继续：`);if(confirmation!=='清空')return;event.currentTarget.disabled=true;try{const result=await post('/api/empty-trash',{confirm:'清空'});trashItems=[];renderTrash();alert(`已永久删除 ${result.deletedVideos} 个视频。`)}catch(error){alert(error.message)}finally{event.currentTarget.disabled=false}};
document.getElementById('cleanAll').onclick=async()=>{const candidates=cleanupCandidates();if(!candidates.length)return;await trashPaths(candidates.map(item=>item.videoPath))};
document.getElementById('taskFilterToggle').onclick=()=>{state.taskFiltersCollapsed=!state.taskFiltersCollapsed;updateTaskFilterCollapse()};window.addEventListener('resize',updateTaskFilterCollapse);
document.getElementById('search').oninput=event=>{state.query=event.target.value;render()};document.getElementById('sortOrder').onchange=event=>{state.sortOrder=event.target.value;render()};document.getElementById('duplicates').onclick=event=>{state.duplicates=!state.duplicates;event.currentTarget.classList.toggle('active',state.duplicates);render()};document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>document.getElementById(button.dataset.close).close());
async function initialize(){refreshFilters();if(!managementToken){document.body.classList.add('readonly');render();return}try{libraryState=await apiRequest('/api/library-state');await loadTrash();render()}catch(error){document.getElementById('managementNotice').hidden=false;render()}}
initialize();
</script>
</body>
</html>
